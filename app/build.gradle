plugins {
    id 'com.android.application'
}

android {
    namespace 'com.wpmulti.test'
    compileSdk 34

    defaultConfig {
        applicationId 'com.wpmulti.test'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation files('libs/wpmulti.aar')
}
